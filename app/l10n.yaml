#
# gen-l10n configuration (X-12, FR-I18N-1..5, BLD-5). Generates AppLocalizations
# from the en-day-one ARB bundle. `generate: true` in pubspec.yaml activates it.
#
# ASCII-technical-identifier rule (FR-I18N-4 / NFR-A11Y-4): technical identifiers
# — esp32 / esp32-s3 / esp32-c3, filesystem paths, and PBLE/1 opcode / capability
# / status names — are NEVER localized. They are not ARB keys; they are rendered
# verbatim (e.g. via the {chip} placeholder in pinReferenceDetailForChip). The
# locale-parity gate (tools/ci/locale_parity.sh, landing later) flags any ARB
# value that localizes a reserved technical token.
arb-dir: lib/localization/arb
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/localization/gen
# Non-nullable AppLocalizations.of(context): the delegate is always installed.
nullable-getter: false
# Untranslated-key report (feeds the locale-parity gate); build/ is gitignored.
untranslated-messages-file: build/l10n_untranslated.json
# Prepend the SPDX-MIT header to every generated Dart file so tools/ci/spdx_lint.sh
# stays green on the committed generated output (the files are tracked under lib/).
header: "// SPDX-License-Identifier: MIT\n// Part of PyBLE (https://pyble.dev) — see /LICENSE.\n// GENERATED by `flutter gen-l10n` from app/lib/localization/arb — do not edit by hand."
