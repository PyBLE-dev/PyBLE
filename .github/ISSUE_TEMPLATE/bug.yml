# SPDX-License-Identifier: MIT
name: Bug report
description: Report a reproducible PyBLE app, firmware, protocol, or website problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose security vulnerabilities here. Use the private
        vulnerability-reporting link in SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App
        - Firmware
        - PBLE/1 protocol
        - Browser installer
        - Website
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version, firmware version, or source commit
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Exact installer profile ID
      description: For installer problems, use the exact profile ID shown on /flash; otherwise enter "Not installer-related."
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Exact board model and module marking
      description: Copy the board model and the text printed on the module; enter "Not applicable" only when no board is involved.
    validations:
      required: true
  - type: input
    id: memory
    attributes:
      label: Memory configuration
      description: Flash capacity, PSRAM capacity, and PSRAM type (Octal, Quad, none, or unknown).
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Browser name and exact version; enter "Not applicable" when the browser is not involved.
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Desktop operating system
      description: Desktop operating system and exact version; enter "Not applicable" when the installer is not involved.
    validations:
      required: true
  - type: input
    id: installer_stage
    attributes:
      label: Failed installer stage
      description: For example page load, browser check, profile selection, artifact verification, port selection, erase, write, verification, first boot, or recovery; otherwise enter "Not installer-related."
    validations:
      required: true
  - type: input
    id: tablet
    attributes:
      label: Exact tablet or device model
      description: Name the iPad or Android device used with the app; enter "Not applicable" only when the app is not involved.
    validations:
      required: true
  - type: input
    id: tablet_os
    attributes:
      label: Tablet operating system
      description: Tablet operating system and exact version (iPadOS or Android); enter "Not applicable" only when the app is not involved.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized diagnostics
      description: Remove device identifiers, personal files, keys, and credentials.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no credential or private information.
          required: true
