#
# Installed as /etc/nginx/sites-available/10-pyble-dev-https.conf after the
# pyble.dev certificate has been issued.

map $status $pyble_firmware_cache_control {
    ~^(?:2[0-9][0-9]|304)$ "public, max-age=31536000, immutable";
    default "no-store";
}

# $request_uri retains the original public path across the internal 404-page
# redirect. Keep missing immutable firmware paths and the retired unversioned
# social cards out of caches while retaining the normal no-cache/no-transform
# policy for the shared website 404 page.
map $request_uri $pyble_not_found_cache_control {
    "/social/pyble-beta-og-1200x630.png" "no-store";
    "/social/pyble-beta-og-1200x630.svg" "no-store";
    ~^/social/pyble-beta-og-1200x630\.png\? "no-store";
    ~^/social/pyble-beta-og-1200x630\.svg\? "no-store";
    ~^/firmware/ "no-store";
    default "no-cache, no-transform";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pyble.dev;

    ssl_certificate /etc/letsencrypt/live/pyble.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pyble.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/pyble/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/pyble-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

    location = / {
        include /etc/nginx/snippets/pyble-security-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        try_files /index.html =404;
    }

    location = /app {
        include /etc/nginx/snippets/pyble-security-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        try_files /app.html =404;
    }

    location = /privacy {
        include /etc/nginx/snippets/pyble-security-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        try_files /privacy.html =404;
    }

    location = /support {
        include /etc/nginx/snippets/pyble-security-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        try_files /support.html =404;
    }

    location = /flash {
        include /etc/nginx/snippets/pyble-security-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        try_files /flash.html =404;
    }

    location = /privacy/ {
        return 308 https://pyble.dev/privacy$is_args$args;
    }

    location = /app/ {
        return 308 https://pyble.dev/app$is_args$args;
    }

    location = /support/ {
        return 308 https://pyble.dev/support$is_args$args;
    }

    location = /flash/ {
        return 308 https://pyble.dev/flash$is_args$args;
    }

    location ^~ /_next/static/ {
        include /etc/nginx/snippets/pyble-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /firmware/ {
        include /etc/nginx/snippets/pyble-security-headers.conf;
        add_header Cache-Control $pyble_firmware_cache_control always;
        alias /srv/pyble/firmware/;
        types {
            application/json json;
            application/octet-stream bin;
            text/markdown md;
            text/plain txt;
        }
        default_type application/octet-stream;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/pyble-security-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/pyble-security-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/pyble-security-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        try_files $uri =404;
    }

    location ~ \.txt$ {
        include /etc/nginx/snippets/pyble-security-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        include /etc/nginx/snippets/pyble-security-headers.conf;
        add_header Cache-Control $pyble_not_found_cache_control always;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pyble.dev;

    ssl_certificate /etc/letsencrypt/live/pyble.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pyble.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/pyble-security-headers.conf;
    return 308 https://pyble.dev$request_uri;
}
