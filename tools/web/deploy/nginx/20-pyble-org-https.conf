#
# Install but do not enable this file until pyble.org and www.pyble.org resolve
# through Cloudflare and the pyble.org certificate has been issued.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pyble.org www.pyble.org;

    ssl_certificate /etc/letsencrypt/live/pyble.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pyble.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/pyble-security-headers.conf;
    return 308 https://pyble.dev$request_uri;
}
